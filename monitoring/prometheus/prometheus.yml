global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "agentic-research-hub"
    scrape_interval: 3s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["agentic-research-hub:8080", "host.docker.internal:5050"]
        labels:
          application: "AgenticResearchHub"
          environment: "production"

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
